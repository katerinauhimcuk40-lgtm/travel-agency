name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Мінімально допустиме покриття рядків (%). Після додавання тестів підняти до 90.
  COVERAGE_THRESHOLD: 0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/coverage.cobertura.xml
          /p:Threshold=${{ env.COVERAGE_THRESHOLD }}
          /p:ThresholdType=line
          /p:ThresholdStat=total

      - name: Coverage report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:coverage/coverage.cobertura.xml -targetdir:coverage/report -reporttypes:"Html;TextSummary;MarkdownSummaryGithub"
          cat coverage/report/Summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report
